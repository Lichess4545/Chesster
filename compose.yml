services:
  app:
    image: ghcr.io/lichess4545/chesster:1.3.0
    restart: unless-stopped
    environment:
      DATABASE_URL_FILE: /run/secrets/chesster_database_url
      CHESSTER_HELTOUR_TOKEN_FILE: /run/secrets/chesster_heltour_token
      CHESSTER_LICHESS_TOKEN_FILE: /run/secrets/chesster_lichess_token
      LICHESS_4545_APP_TOKEN_FILE: /run/secrets/chesster_lichess_4545_app_token
      LICHESS_4545_SIGNING_SECRET_FILE: /run/secrets/chesster_lichess_4545_signing_secret
      LICHESS_4545_BOT_TOKEN_FILE: /run/secrets/chesster_lichess_4545_bot_token
      FORWARD_APP_TOKEN_FILE: /run/secrets/chesster_forward_app_token
      FORWARD_SIGNING_SECRET_FILE: /run/secrets/chesster_forward_signing_secret
      FORWARD_BOT_TOKEN_FILE: /run/secrets/chesster_forward_bot_token
    secrets:
      - chesster_database_url
      - chesster_heltour_token
      - chesster_lichess_token
      - chesster_lichess_4545_app_token
      - chesster_lichess_4545_signing_secret
      - chesster_lichess_4545_bot_token
      - chesster_forward_app_token
      - chesster_forward_signing_secret
      - chesster_forward_bot_token

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    environment:
      - DOZZLE_BASE=/logs
      - DOZZLE_FILTER=label=com.docker.stack.namespace=${STACK_NAME:-4545-chesster}
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_DISABLE_SETUP_WIZARD=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - frontend
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.services.chesster-dozzle.loadbalancer.server.port=8080
      - traefik.http.routers.chesster-dozzle.rule=Host(`chesster.lichess.app`) && PathPrefix(`/logs`)
      - traefik.http.routers.chesster-dozzle.entrypoints=websecure
      - traefik.http.routers.chesster-dozzle.tls=true
      - traefik.http.routers.chesster-dozzle.tls.certresolver=myresolver
      - traefik.http.routers.chesster-dozzle.middlewares=authentik@file
      - traefik.http.routers.chesster-dozzle.priority=100
      - traefik.http.routers.chesster-dozzle.service=chesster-dozzle
      - traefik.http.routers.chesster-outpost.rule=Host(`chesster.lichess.app`) && PathPrefix(`/outpost.goauthentik.io`)
      - traefik.http.routers.chesster-outpost.entrypoints=websecure
      - traefik.http.routers.chesster-outpost.tls=true
      - traefik.http.routers.chesster-outpost.tls.certresolver=myresolver
      - traefik.http.routers.chesster-outpost.priority=200
      - traefik.http.routers.chesster-outpost.service=authentik-server@file

networks:
  frontend:
    external: true

secrets:
  chesster_database_url:
    external: true
  chesster_heltour_token:
    external: true
  chesster_lichess_token:
    external: true
  chesster_lichess_4545_app_token:
    external: true
  chesster_lichess_4545_signing_secret:
    external: true
  chesster_lichess_4545_bot_token:
    external: true
  chesster_forward_app_token:
    external: true
  chesster_forward_signing_secret:
    external: true
  chesster_forward_bot_token:
    external: true
