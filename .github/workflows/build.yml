name: Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: cachix/install-nix-action@v31

            - name: Install devenv
              run: nix profile install nixpkgs#devenv

            - name: Check nixpkgs pins match
              run: ci/nixpkgs-pin.sh

            - name: Install packages
              run: devenv shell -- yarn install

            - name: Build project
              run: devenv shell -- yarn build

            - name: Run TSLint
              run: devenv shell -- yarn lint

            - name: Run tests
              run: devenv shell -- yarn test

    nix:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4
            - uses: cachix/install-nix-action@v31
            - run: nix flake check --print-build-logs
